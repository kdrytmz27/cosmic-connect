name: Cosmic Connect CI/CD Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: cosmic_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: ./backend
        
    steps:
    - uses: actions/checkout@v3
    - name: Use Node.js 18.x
      uses: actions/setup-node@v3
      with:
        node-version: 18.x
        cache: 'npm'
        cache-dependency-path: './backend/package-lock.json'
        
    - name: Install Dependencies
      run: npm ci
      
    - name: Generate Prisma Client
      run: npx prisma generate
      
    - name: Init DB Schema
      run: npx prisma db push
      env:
        DATABASE_URL: "postgresql://postgres:testpassword@localhost:5432/cosmic_test"
      
    - name: Run Backend Tests
      run: npm run test
      env:
        DATABASE_URL: "postgresql://postgres:testpassword@localhost:5432/cosmic_test"

  frontend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
    - uses: actions/checkout@v3
    - name: Use Node.js 18.x
      uses: actions/setup-node@v3
      with:
        node-version: 18.x
        cache: 'npm'
        cache-dependency-path: './frontend/package-lock.json'
        
    - name: Install Dependencies
      run: npm ci
      
    - name: Run Frontend Lint & Tests
      run: |
        npm run test

  admin-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./admin

    steps:
    - uses: actions/checkout@v3
    - name: Use Node.js 18.x
      uses: actions/setup-node@v3
      with:
        node-version: 18.x
        cache: 'npm'
        cache-dependency-path: './admin/package-lock.json'
        
    - name: Install Dependencies
      run: npm ci
      
    - name: Admin Panel Build Check
      run: npm run build

  docker-build:
    needs: [backend-test, frontend-test, admin-build]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
    - uses: actions/checkout@v3
    - name: Verify Docker Compose Build
      run: docker-compose build
