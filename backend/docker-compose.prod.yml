version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: cosmic_postgres
    restart: always
    environment:
      POSTGRES_USER: cosmic
      POSTGRES_PASSWORD: ${DB_PASSWORD:-cosmic_prod_secure_password_123}
      POSTGRES_DB: cosmicconnect
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - cosmic_net

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cosmic_backend
    restart: always
    depends_on:
      - postgres
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://cosmic:${DB_PASSWORD:-cosmic_prod_secure_password_123}@postgres:5432/cosmicconnect?schema=public
      - JWT_SECRET=${JWT_SECRET:-YOUR_SUPER_SECRET_KEY}
      - FRONTEND_URL=${FRONTEND_URL:-capacitor://localhost}
    volumes:
      - ./uploads:/app/uploads
    networks:
      - cosmic_net

volumes:
  pgdata:

networks:
  cosmic_net:
    driver: bridge
