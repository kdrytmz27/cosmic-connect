version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: cosmic-postgres
    environment:
      POSTGRES_USER: cosmicuser
      POSTGRES_PASSWORD: cosmicpassword
      POSTGRES_DB: cosmicdb
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: always

  redis:
    image: redis:7
    container_name: cosmic-redis
    ports:
      - "6379:6379"
    restart: always

volumes:
  postgres-data:
