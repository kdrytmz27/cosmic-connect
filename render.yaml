# Render.com Deployment — render.yaml
# Bu dosya Render.com'a push ettiğinizde otomatik deploy yapar
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: cosmic-connect-backend
    runtime: node
    region: frankfurt  # EU bölgesi (Türkiye'ye yakın)
    plan: free
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: JWT_SECRET
        generateValue: true  # Render otomatik güçlü secret oluşturur
      - key: DATABASE_URL
        fromDatabase:
          name: cosmic-connect-db
          property: connectionString
      - key: FRONTEND_URL
        value: capacitor://localhost
    healthCheckPath: /health

databases:
  - name: cosmic-connect-db
    plan: free  # 256MB, 90 gün sonra silinir (daha sonra upgrade edilebilir)
    region: frankfurt
    databaseName: cosmic_connect
    user: cosmic_user
