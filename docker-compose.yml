version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: cosmic_connect_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: cosmic_connect
      POSTGRES_USER: cosmic_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cosmic_user -d cosmic_connect"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cosmic_connect_backend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set}
      - DATABASE_URL=postgresql://cosmic_user:${POSTGRES_PASSWORD}@postgres:5432/cosmic_connect?schema=public
      - FRONTEND_URL=${FRONTEND_URL:-capacitor://localhost}
      - PORT=3000
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - backend_uploads:/app/uploads
    restart: unless-stopped

volumes:
  postgres_data:
  backend_uploads:
